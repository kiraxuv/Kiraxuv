<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>KGG Game Register</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="fixed-content-wrapper">
        <div class="header">
    <a href="../index.html" class="back-arrow register-back-arrow"><i class="fas fa-arrow-left"></i></a>
    <span class="flag-icon"><img src="assets/ind.jpg" alt="US Flag"></span>
</div>


        <div class="registration-container">
            <img src="assets/kwg.jpg" alt="KGG GAME Logo" class="page-logo-image">
            
            <div class="form-group">
                <label for="reg-phone-number"><i class="fas fa-mobile-alt"></i> Phone Number</label>
                <div class="input-wrapper">
                    <div class="country-code-select">
                        <select id="reg-country-code" name="reg-country-code">
                            <option value="+91" selected>+91 (India)</option>
                            <option value="+1">+1        
 (USA/Canada)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+86">+86 (China)</option>
                            <option value="+61">+61 (Australia)</option>
                            <option value="+49">+49 (Germany)</option>
                        </select>
                        <i class="fas fa-caret-down dropdown-arrow"></i>
                    </div>
                    <input type="tel" id="reg-phone-number" name="reg-phone-number" placeholder="Please input your phone num" required>
                </div>
            </div>

            <div class="form-group">
                <label for="set-password"><i class="fas fa-lock"></i> Set Password</label>
                <div class="input-wrapper password-input-wrapper">
                    <input type="password" id="set-password" name="set-password" placeholder="Set Password" required>
                    <span class="password-toggle"><i class="fas fa-eye-slash"></i></span>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm-password"><i class="fas fa-lock"></i> Confirm Password</label>
                <div class="input-wrapper password-input-wrapper">
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm Password" required>
                    <span class="password-toggle"><i class="fas fa-eye-slash"></i></span>
                </div>
            </div>

            <div class="form-group">
                <label for="invite-code"><i class="fas fa-ticket-alt"></i> Invite Code</label>
                <div class="input-wrapper">
                    <input type="text" id="invite-code" name="invite-code" placeholder="Please enter the invitation code">
                </div>
            </div>

            <div class="privacy-agreement">
                <label class="checkbox-container">I have read and agree <a href="#" class="privacy-link">【Privacy Agreement】</a>
                    <input type="checkbox" required>
                    <span class="checkmark"></span>
                </label>
            </div>

            <button type="submit" class="btn register-main-btn">Register</button>
            <a href="login.html" class="btn login-from-register-btn">I have an account Login</a>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
