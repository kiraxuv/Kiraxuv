<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF="8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>KWGGAME - Activity</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/activity.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="fixed-content-wrapper">
        <div class="top-header">
            <img src="assets/kwg.jpg" alt="KWGGAME Logo" class="top-header-logo">
        </div>

        <div class="main-content activity-content">
            <div class="activity-page-header">
                <h1 class="activity-title">Activity</h1>
                <p class="activity-subtitle">Complete daily tasks, win ₹9999 & VIP prizes instantly!</p>
            </div>

            <div class="activity-grid">
                <div class="activity-card">
                    <img src="assets/rewardcentre.png" alt="Reward Center">
                    <span>Reward Center</span>
                </div>
                <div class="activity-card">
                    <img src="assets/dailyorweeklyactivity.png" alt="Daily or Weekly activities">
                    <span>Daily or Weekly activities</span>
                </div>
                <div class="activity-card">
                    <img src="assets/wheeloffortune.png" alt="Wheel of Fortune">
                    <span>Wheel of Fortune</span>
                </div>
                <div class="activity-card">
                    <img src="assets/kwgcheckinandwin.png" alt="KWG Check-in & Win">
                    <span>KWG Check-in & Win</span>
                </div>
                <div class="activity-card">
                    <img src="assets/giftcode.png" alt="Gift Code">
                    <span>Gift Code</span>
                </div>
                <div class="activity-card">
                    <img src="assets/vipcentre.png" alt="VIP Center">
                    <span>VIP Center</span>
                </div>
                <div class="activity-card">
                    <img src="assets/customer.png" alt="Customer Service Application">
                    <span>Customer Service Application</span>
                </div>
                <div class="activity-card">
                    <img src="assets/activitycollection.png" alt="Activity Collection">
                    <span>Activity Collection</span>
                </div>
            </div>
           
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="activity.html" class="nav-item active">
                <i class="fas fa-trophy"></i>
                <span>Activity</span>
            </a>
            <a href="#" class="nav-item promotion-center">
                <i class="fas fa-gift"></i>
                <span>Promotion</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-wallet"></i>
                <span>Wallet</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fas fa-user"></i>
                <span>Account</span>
            </a>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/activity.js"></script>
</body>
</html>
