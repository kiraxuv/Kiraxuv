<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>KGG Game Login</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="fixed-content-wrapper">
        <div class="header">
            <a href="../index.html" class="back-arrow register-back-arrow"><i class="fas fa-arrow-left"></i></a>
            <span class="flag-icon"><img src="../ind.jpg" alt="US Flag"></span>
        </div>

        <div class="login-container">
            <img src="assets/kwg.jpg" alt="KGG GAME Logo" class="page-logo-image">
            
            <h1>Login</h1>
            <p class="instructions">Please log in with your phone number or uid</p>
            <p class="forgot-info">If you forget your password, please contact customer service</p>

            <div class="tab-selector">
                <div class="tab active" data-tab="phone">
                    <i class="fas fa-mobile-alt"></i>
                    <span>Login With Phone</span>
                </div>
                <div class="tab" data-tab="uid">
                    <i class="fas fa-user-alt"></i>
                    <span>UID</span>
                </div>
            </div>

            <div id="phone-login-section" class="login-section active">
                <div class="form-group">
                    <div class="input-wrapper">
                        <div class="country-code-select">
                            <select id="country-code" name="country-code">
                                <option value="+91" selected>+91</option>
                                <option value="+1">+1</option>
                                <option value="+44">+44</option>
                                <option value="+86">+86</option>
                                <option value="+61">+61</option>
                                <option value="+49">+49</option>
                            </select>
                            <i class="fas fa-caret-down dropdown-arrow"></i>
                        </div>
                        <input type="tel" id="phone-number" name="phone-number" placeholder="Please input your phone num" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-input-wrapper">
                        <input type="password" id="password" name="password" placeholder="PassWord" required>
                        <span class="password-toggle"><i class="fas fa-eye-slash"></i></span>
                    </div>
                </div>

                <div class="remember-password">
                    <label class="checkbox-container">Remember Password
                        <input type="checkbox" checked="checked">
                        <span class="checkmark"></span>
                    </label>
                </div>
            </div>

            <div id="uid-login-section" class="login-section" style="display: none;">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="uid" name="uid" placeholder="Enter your UID" required>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper password-input-wrapper">
                        <input type="password" id="uid-password" name="uid-password" placeholder="PassWord" required>
                        <span class="password-toggle"><i class="fas fa-eye-slash"></i></span>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn login-btn">Login</button>
            <button type="button" class="btn register-btn">Register</button>

            <div class="footer-links">
                <a href="#" class="footer-link">
                    <i class="fas fa-lock"></i>
                    <span>Forgot Password</span>
                </a>
                <a href="#" class="footer-link">
                    <i class="fas fa-headset"></i>
                    <span>Customer Service</span>
                </a>
            </div>
        </div>
    </div>
    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
